# socs/sc7280/soc.conf: what this SoC repository is: the facts of a Qualcomm SC7280-family chip, whatever phone it is in.
# A phone with this SoC includes configs/sc7280.config from its defconfig. docs/porting/repositories.md has every word.

soc sc7280
	title       Qualcomm SC7280 family (SM7325 "Snapdragon 778G", QCM6490; "yupik", "kodiak")
	vendor      Qualcomm
	cores       8, the biggest is core 7
	gpu         Adreno 642L
	maintainer  the HakiOS developers (README.md)
