# Xiaomi Mi 10: eight-core iOS RAM boot with ST FTS521 touch.
NAME="Xiaomi Mi 10 (umi)"
KIND=phone
SOC="Qualcomm Snapdragon 865 (SM8250)"
CODENAMES="umi umi_id"
UEFI_TARGET=umi
# Supply the UMI firmware and its matching shim addresses in the environment.
UEFI_FD=${UEFI_FD:-}
DTB=${DTB:-$ROOT/../umi.dtb}
FD_BASE=${FD_BASE:-0x9FC00000}
FD_SIZE=${FD_SIZE:-0x300000}
PAYLOAD_BASE=${PAYLOAD_BASE:-0xF0000000}
FB_BASE=0x9C000000
WIFI_ATH11K=1
# XNU takes all cores; USB resumes when the timed session returns.
# For live USB diagnostics: XL_CMDLINE="bootcpu=7 cpus=7 umi_touch=1 umi_keys=1".
BOOTARGS="bootcpu=0 cpus=8 umi_touch=1 umi_keys=1 umi_haptic=5 adsp=1 adsp_umi=1 sound=4 gpu=1 metal=1 fb_scan=1 fb_threads=6 fb_filter=0 cpufreq=1 wifi=1"
BOARD_ARGS=""
DEFAULT_SECS=300
USERLAND_VARS="GL=1 ADSP= WIFID=1 RC_JOBS=rc.jobs.umi-boot"
FIRMWARE=""
LOADER_EFI=out/umi/loader.efi
