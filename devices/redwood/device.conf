# devices/redwood/device.conf: what this device repository is. tools/hakios-device.py reads it; docs/porting/repositories.md has
# every word, and the device's page (docs/devices/redwood.md) is made from it, so that the status is said in one place.

device redwood
	title       POCO X5 Pro 5G
	vendor      Xiaomi
	soc         sc7280
	defconfig   redwood_defconfig
	firmware    pull-firmware.sh
	maintainer  the HakiOS developers (README.md)
	status      display     works     the panel through UEFI's framebuffer; frames drawn by the GPU with gpu=1
	status      touch       works     Goodix GT9916 / FocalTech FT3680 on SPI, multitouch (CONFIG_HAKIOS_GOODIX, touchscreen=1)
	status      buttons     works     power and volume through the PMIC (CONFIG_HAKIOS_BUTTONS)
	status      cpu         works     all 8 cores, the big core at 2.4 GHz (cpus=8 bootcpu=7 cpufreq=1)
	status      gpu         works     Adreno 642L, OpenGL ES through Mesa (gpu=1); Metal: buffers and libraries, no drawing yet
	status      storage     works     UFS read through the loader; /private/var kept with var_store=1 ufs_write=1
	status      audio       works     speakers and microphone through the audio DSP (adsp=1 sound=4 mic=4)
	status      battery     partial   the level in the UI through the audio DSP; charging under this kernel is not done
	status      haptic      works     Awinic AW86927 (haptic=5)
	status      camera      works     Camera.app (cam=5)
	status      torch       partial   the PM8350C flash LED and Control Center's button (torch=N); not in the README's list of what works
	status      wifi        works     WCN6750 with Linux's ath11k: radio, driver, a network joined (wifi=1)
	status      bluetooth   missing   step one only: a read-only look at its pins (bt=1)
	status      cellular    partial   the modem boots, sees the network, the SIM is bound, IPA and en1 in place; no registration yet
	status      thermal     partial   27 of 27 sensors read on the phone (thermal=1); the stop (thermal_stop=) not yet seen firing
