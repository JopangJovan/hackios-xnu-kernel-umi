# devices/manifest.conf: every SoC and device repository HakiOS knows of (Android's repo manifest, UniXNU's devices.toml).
#
#   device|uefi <name>                                  (a device carries its SoC's layer in soc/; the UEFI is one, in uefi/)
#   soc <name>                                          (a SoC layer of its own, in socs/<name>: for one many devices share)
#       path        <directory in this tree>                kept here, for now: tools/hakios-device.py split makes it a repository
#       repository  <git URL>                               a repository of its own, cloned into socs/<name> or devices/<name>
#       revision    <commit>                                ... at this commit (tools/hakios-device.py lock writes it)
#
# `tools/hakios-device.py sync` clones and updates the ones with a repository; `list` shows them all; docs/porting/repositories.md
# is the guide. A device of yours: open a pull request that adds its block here, with its repository and revision.

device redwood
	repository  https://github.com/oosexgang/hakios-redwood.git
	revision    84c2cb861bccfb4d76fba9976b2d7810a95ed662

device qemu
	path        devices/qemu

uefi hakios-uefi
	repository  https://github.com/oosexgang/hakios-uefi.git
	revision    398393659c90c45b07e30fbd34cff5efa5f794b2
