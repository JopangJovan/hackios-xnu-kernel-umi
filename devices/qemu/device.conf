# devices/qemu/device.conf: QEMU's virt machine as a device: what a port looks like with none of a phone's drivers built in.

device qemu
	title       QEMU virt (aarch64)
	vendor      QEMU
	soc         none
	defconfig   qemu_defconfig
	maintainer  the HakiOS developers (README.md)
	status      display     works     ramfb, through the loader
	status      touch       works     virtio tablet as the touch screen (CONFIG_HAKIOS_VIRTIO_INPUT)
	status      buttons     works     virtio keyboard: H is Home, L the power button, arrows the volume
	status      storage     works     virtio-blk images (CONFIG_HAKIOS_VIRTIO_BLK)
	status      audio       works     virtio sound (CONFIG_HAKIOS_VIRTIO_SOUND)
	status      network     works     virtio-net as en0 (CONFIG_HAKIOS_VIRTIO_NET)
	status      gpu         missing   no GPU: the screen is drawn in software
